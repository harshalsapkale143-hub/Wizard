name: Fundamentals Research

on:
  workflow_dispatch:

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4 openpyxl xlrd playwright
      - name: Download NSE metadata sources
        run: python scripts/download_nse_metadata_sources.py
      - name: Build point-in-time metadata
        env:
          METADATA_SOURCE_DIR: metadata_sources
          LISTING_SOURCE_FILE: metadata_sources/listing_dates.csv
        run: python scripts/build_historical_metadata.py
      - name: Verify point-in-time metadata
        shell: bash
        run: |
          test -s metadata/universe_symbols.csv || { echo 'metadata/universe_symbols.csv missing after metadata build'; exit 1; }
      - name: Select technical candidates when results are available
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          universe = pd.read_csv('metadata/universe_symbols.csv')
          symbol_col = next(c for c in universe.columns if c.lower() in {'symbol','symbols','ticker'})
          candidates=set()
          for p in Path('results').glob('*trades.csv'):
              try:
                  d=pd.read_csv(p)
              except Exception:
                  continue
              for c in d.columns:
                  if c.lower() in {'symbol','ticker'}:
                      candidates.update(d[c].dropna().astype(str).str.replace('.NS','',regex=False).str.strip())
          if candidates:
              compact=universe[universe[symbol_col].astype(str).str.replace('.NS','',regex=False).str.strip().isin(candidates)]
              if len(compact) >= 10:
                  universe=compact
          Path('metadata/fundamental_candidate_symbols.txt').write_text('\n'.join(sorted(set(universe[symbol_col].dropna().astype(str).str.replace('.NS','',regex=False).str.strip())))+'\n')
          universe.to_csv('metadata/universe_symbols.csv',index=False)
          print(f'Fundamental universe: {len(universe)} symbols')
          PY
      - name: Acquire fundamentals from Upstox
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          FUNDAMENTALS_MAX_SYMBOLS: '25'
        run: python scripts/build_fundamentals_upstox.py
      - name: Restore fundamentals cache
        uses: actions/cache/restore@v4
        with:
          path: fundamentals
          key: wizard-fundamentals-v2-${{ hashFiles('metadata/fundamental_candidate_symbols.txt') }}
          restore-keys: |
            wizard-fundamentals-v2-
      - name: Save fundamentals cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fundamentals
          key: wizard-fundamentals-v2-${{ hashFiles('metadata/fundamental_candidate_symbols.txt') }}-${{ github.run_id }}
      - name: Validate Upstox fundamentals coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          files=list(Path('fundamentals_upstox').glob('*.csv'))
          print(f'Upstox fundamentals files: {len(files)}')
          if not files: raise SystemExit('No Upstox fundamentals were produced.')
          PY
      - name: Run fundamental SEPA research
        run: python fundamental_sepa_experiment.py
      - name: Run EPS growth and acceleration experiment
        run: python fundamental_eps_experiment.py
      - name: Upload fundamentals results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wizard-fundamentals-research
          path: |
            fundamentals/
            results/
            metadata/
          if-no-files-found: warn
