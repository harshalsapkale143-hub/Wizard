name: Fundamentals Research

on:
  workflow_dispatch:

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4 openpyxl xlrd playwright
      - name: Download NSE metadata sources
        run: python scripts/download_nse_metadata_sources.py
      - name: Use existing point-in-time metadata
        shell: bash
        run: |
          test -s metadata/universe_symbols.csv || { echo 'metadata/universe_symbols.csv missing'; exit 1; }
      - name: Select technical candidates when results are available
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          universe = pd.read_csv('metadata/universe_symbols.csv')
          symbol_col = next(c for c in universe.columns if c.lower() in {'symbol','symbols','ticker'})
          candidates=set()
          for p in Path('results').glob('*trades.csv'):
              try:
                  d=pd.read_csv(p)
              except Exception:
                  continue
              for c in d.columns:
                  if c.lower() in {'symbol','ticker'}:
                      candidates.update(d[c].dropna().astype(str).str.replace('.NS','',regex=False).str.strip())
          if candidates:
              compact=universe[universe[symbol_col].astype(str).str.replace('.NS','',regex=False).str.strip().isin(candidates)]
              if len(compact) >= 10:
                  universe=compact
          Path('metadata/fundamental_candidate_symbols.txt').write_text('\n'.join(sorted(set(universe[symbol_col].dropna().astype(str).str.replace('.NS','',regex=False).str.strip())))+'\n')
          universe.to_csv('metadata/universe_symbols.csv',index=False)
          print(f'Fundamental universe: {len(universe)} symbols')
          PY
      - name: Install browser runtime
        run: python -m playwright install --with-deps chromium
      - name: Restore fundamentals cache
        uses: actions/cache/restore@v4
        with:
          path: fundamentals
          key: wizard-fundamentals-v2-${{ hashFiles('metadata/fundamental_candidate_symbols.txt') }}
          restore-keys: |
            wizard-fundamentals-v2-
      - name: Build point-in-time fundamentals
        timeout-minutes: 35
        run: |
          /usr/bin/time -f 'FUNDAMENTALS_SECONDS=%e' python scripts/build_historical_fundamentals.py
      - name: Save fundamentals cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fundamentals
          key: wizard-fundamentals-v2-${{ hashFiles('metadata/fundamental_candidate_symbols.txt') }}-${{ github.run_id }}
      - name: Validate fundamentals coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files=[p for p in Path('fundamentals').glob('*.csv') if p.name != '_build_diagnostics.csv']
          usable=[]
          for p in files:
              try:
                  d=pd.read_csv(p)
                  if {'period_end','filing_date','eps','revenue','pat'}.issubset(d.columns) and len(d)>=5:
                      usable.append(p)
              except Exception:
                  pass
          print(f'Usable fundamentals files: {len(usable)}')
          if not usable:
              raise SystemExit('No usable point-in-time fundamentals files were produced.')
          PY
      - name: Run fundamental SEPA research
        run: python fundamental_sepa_experiment.py
      - name: Run EPS growth and acceleration experiment
        run: python fundamental_eps_experiment.py
      - name: Upload fundamentals results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wizard-fundamentals-research
          path: |
            fundamentals/
            results/
            metadata/
          if-no-files-found: warn
