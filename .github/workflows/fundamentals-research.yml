name: Fundamentals Research

on:
  workflow_dispatch:

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4 openpyxl xlrd playwright
      - name: Download NSE metadata sources
        run: python scripts/download_nse_metadata_sources.py
      - name: Build point-in-time metadata
        env:
          METADATA_SOURCE_DIR: metadata_sources
          LISTING_SOURCE_FILE: metadata_sources/listing_dates.csv
        run: python scripts/build_historical_metadata.py
      - name: Install browser runtime
        run: python -m playwright install --with-deps chromium
      - name: Restore fundamentals cache
        uses: actions/cache/restore@v4
        with:
          path: fundamentals
          key: wizard-fundamentals-v1-${{ hashFiles('metadata/universe_symbols.csv') }}
          restore-keys: |
            wizard-fundamentals-v1-
      - name: Build point-in-time fundamentals
        timeout-minutes: 50
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          meta = pd.read_csv('metadata/universe_symbols.csv')
          symbol_col = next(c for c in meta.columns if c.lower() in {'symbol','symbols','ticker'})
          symbols = sorted(set(meta[symbol_col].dropna().astype(str).str.replace('.NS','',regex=False).str.strip()))
          Path('metadata/fundamental_candidate_symbols.txt').write_text('\n'.join(symbols) + ('\n' if symbols else ''))
          print(f'Fundamental universe: {len(symbols)} symbols')
          PY
          /usr/bin/time -f 'FUNDAMENTALS_SECONDS=%e' python scripts/build_historical_fundamentals.py
      - name: Save fundamentals cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fundamentals
          key: wizard-fundamentals-v1-${{ hashFiles('metadata/universe_symbols.csv') }}-${{ github.run_id }}
      - name: Run fundamental SEPA research
        if: success()
        run: python fundamental_sepa_experiment.py
      - name: Run EPS growth and acceleration experiment
        if: success()
        run: python fundamental_eps_experiment.py
      - name: Upload fundamentals results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wizard-fundamentals-research
          path: |
            fundamentals/
            results/
            metadata/
          if-no-files-found: warn
