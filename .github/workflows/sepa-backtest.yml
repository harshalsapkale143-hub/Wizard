name: SEPA Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [ main, master ]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Check daily market data
        id: data
        shell: bash
        run: |
          test -f data/NIFTY50.csv || { echo 'Daily backtest waiting: data/NIFTY50.csv is missing.' >> "$GITHUB_STEP_SUMMARY"; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; }
          shopt -s nullglob
          files=(data/*.csv)
          if (( ${#files[@]} < 2 )); then
            echo 'Daily backtest waiting: add stock CSV files under data/.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found ${#files[@]} CSV files." >> "$GITHUB_STEP_SUMMARY"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Run daily SEPA/VCP backtest
        if: steps.data.outputs.ready == 'true'
        run: python daily_sepa_backtest.py --data-dir data --market NIFTY50.csv --output results

      - name: Upload results
        if: steps.data.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-sepa-backtest-results
          path: results/
          if-no-files-found: error
