name: SEPA Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: sepa-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4 openpyxl xlrd openchart

      - name: Download NSE metadata sources
        run: python scripts/download_nse_metadata_sources.py

      - name: Build point-in-time metadata
        env:
          METADATA_SOURCE_DIR: metadata_sources
          LISTING_SOURCE_FILE: metadata_sources/listing_dates.csv
        run: python scripts/build_historical_metadata.py

      - name: Restore daily market-data cache
        uses: actions/cache@v4
        with:
          path: data
          key: sepa-daily-data-OS-2026-09-08-v1-${{ runner.os }}

      - name: Download and build historical research universe
        run: /usr/bin/time -f 'MARKET_DATA_SECONDS=%e' python scripts/build_nifty50_daily.py

      - name: Validate daily market data
        id: data
        shell: bash
        run: |
          test -s data/NIFTY50.csv
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          required={'timestamp','open','high','low','close','volume'}
          valid=[]
          for f in Path('data').glob('*.csv'):
              d=pd.read_csv(f)
              if required.issubset(d.columns) and len(d)>=250:
                  valid.append(f)
          print('Valid datasets:',len(valid))
          if len(valid)<100:
              raise SystemExit('Need at least 100 historical stock datasets')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Restore 5-minute market-data cache
        uses: actions/cache@v4
        with:
          path: data/intraday5m
          key: sepa-intraday5m-2026-07-10-to-2026-09-08-v2-${{ runner.os }}

      - name: Download 5-minute breakout data
        if: steps.data.outputs.ready == 'true'
        run: python download_nse_5m_openchart.py

      - name: Validate 5-minute market data
        if: steps.data.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          required={"timestamp","open","high","low","close","volume"}
          valid=[]
          for f in Path("data/intraday5m").glob("*.csv"):
              try:
                  d=pd.read_csv(f)
                  if required.issubset(d.columns) and len(d)>1000:
                      valid.append(f)
              except Exception:
                  pass
          print("Valid 5-minute datasets:",len(valid))
          if len(valid) < 10:
              raise SystemExit("Need at least 10 usable 5-minute datasets")
          PY

      - name: Run intraday exact-breakout backtest
        if: steps.data.outputs.ready == 'true'
        run: python intraday_breakout_backtest.py --data-dir data --intraday-dir data/intraday5m --market NIFTY50.csv --output results_intraday

      - name: Validate intraday results
        if: steps.data.outputs.ready == 'true'
        shell: bash
        run: |
          test -s results_intraday/performance.csv
          test -s results_intraday/trades.csv
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv("results_intraday/performance.csv")
          required={"final_capital","total_return_pct","trades","profit_factor"}
          if not required.issubset(p.columns):
              raise SystemExit("Intraday performance.csv is missing required fields")
          print(p.to_string(index=False))
          PY

      - name: Run daily SEPA/VCP backtest
        if: steps.data.outputs.ready == 'true'
        run: python daily_sepa_backtest.py --data-dir data --market NIFTY50.csv --output results

      - name: Upload production backtest results
        if: always() && steps.data.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: production-backtest-results
          path: |
            results/
            results_intraday/
          if-no-files-found: error
