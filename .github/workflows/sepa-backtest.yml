name: SEPA Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [ main, master ]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4
      - name: Download and build daily data
        run: python scripts/build_nifty50_daily.py
      - name: Validate daily market data
        id: data
        shell: bash
        run: |
          test -s data/NIFTY50.csv || { echo 'NIFTY50 index data is missing.' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          required={'timestamp','open','high','low','close','volume'}
          files=list(Path('data').glob('*.csv'))
          valid=[]
          for f in files:
              d=pd.read_csv(f)
              if required.issubset(d.columns) and len(d)>=250: valid.append((f.name,len(d)))
          print('Valid datasets:', valid)
          if len(valid)<11: raise SystemExit(f'Need at least 11 datasets, found {len(valid)}')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'Validated market and stock datasets.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run daily SEPA/VCP backtest
        if: steps.data.outputs.ready == 'true'
        run: python daily_sepa_backtest.py --data-dir data --market NIFTY50.csv --output results
      - name: Run robustness and out-of-sample analysis
        if: steps.data.outputs.ready == 'true'
        run: python robustness_backtest.py
      - name: Download NSE metadata sources
        if: steps.data.outputs.ready == 'true'
        run: python scripts/download_nse_metadata_sources.py
      - name: Build point-in-time metadata
        if: steps.data.outputs.ready == 'true'
        env:
          METADATA_SOURCE_DIR: metadata_sources
          LISTING_SOURCE_FILE: metadata_sources/listing_dates.csv
        run: python scripts/build_historical_metadata.py
      - name: Run young/small-cap experiment
        if: steps.data.outputs.ready == 'true'
        run: python young_small_cap_experiment.py
      - name: Upload results and metadata
        if: steps.data.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-sepa-backtest-results
          path: |
            results/
            metadata/
            metadata_sources/
          if-no-files-found: error
