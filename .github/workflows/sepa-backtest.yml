name: SEPA Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [ main, master ]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Download and build NIFTY 50 daily data from NSE
        run: python scripts/build_nifty50_daily.py

      - name: Check daily market data
        id: data
        shell: bash
        run: |
          test -f data/NIFTY50.csv || { echo 'NIFTY50 index file is missing.' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          shopt -s nullglob
          files=(data/*.csv)
          if (( ${#files[@]} < 2 )); then
            echo 'NSE download produced fewer than two CSV files.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Found ${#files[@]} CSV files." >> "$GITHUB_STEP_SUMMARY"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Run daily SEPA/VCP backtest
        if: steps.data.outputs.ready == 'true'
        run: python daily_sepa_backtest.py --data-dir data --market NIFTY50.csv --output results

      - name: Upload results
        if: steps.data.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-sepa-backtest-results
          path: results/
          if-no-files-found: error
