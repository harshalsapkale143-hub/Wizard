name: SEPA Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [ main, master ]

concurrency:
  group: sepa-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4 openpyxl xlrd
      - name: Download NSE metadata sources
        run: python scripts/download_nse_metadata_sources.py
      - name: Build point-in-time metadata
        env:
          METADATA_SOURCE_DIR: metadata_sources
          LISTING_SOURCE_FILE: metadata_sources/listing_dates.csv
        run: python scripts/build_historical_metadata.py
      - name: Restore historical market-data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: sepa-research-data-${{ hashFiles('metadata/universe_symbols.csv') }}-${{ github.run_id }}
          restore-keys: |
            sepa-research-data-${{ hashFiles('metadata/universe_symbols.csv') }}-
      - name: Download and build historical research universe
        run: /usr/bin/time -f 'MARKET_DATA_SECONDS=%e' python scripts/build_nifty50_daily.py
      - name: Save refreshed historical market-data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: sepa-research-data-${{ hashFiles('metadata/universe_symbols.csv') }}-${{ github.run_id }}
      - name: Validate daily market data
        id: data
        shell: bash
        run: |
          test -s data/NIFTY50.csv || { echo 'NIFTY50 index data is missing.' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          required={'timestamp','open','high','low','close','volume'}
          files=list(Path('data').glob('*.csv'))
          valid=[]
          for f in files:
              d=pd.read_csv(f)
              if required.issubset(d.columns) and len(d)>=250: valid.append((f.name,len(d)))
          print('Valid datasets:', len(valid))
          if len(valid)<100: raise SystemExit(f'Need at least 100 historical stock datasets, found {len(valid)}')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Run daily SEPA/VCP backtest
        if: steps.data.outputs.ready == 'true'
        run: /usr/bin/time -f 'DAILY_BACKTEST_SECONDS=%e' python daily_sepa_backtest.py --data-dir data --market NIFTY50.csv --output results
      - name: Run robustness and out-of-sample analysis
        if: steps.data.outputs.ready == 'true'
        run: /usr/bin/time -f 'ROBUSTNESS_SECONDS=%e' python robustness_backtest.py
      - name: Run yearly and market-regime analysis
        if: steps.data.outputs.ready == 'true'
        run: /usr/bin/time -f 'YEARLY_REGIME_SECONDS=%e' python yearly_regime_analysis.py
      - name: Run walk-forward OOS validation
        if: steps.data.outputs.ready == 'true'
        run: /usr/bin/time -f 'WALK_FORWARD_SECONDS=%e' python walk_forward_analysis.py
      - name: Run trade-level diagnostics
        if: steps.data.outputs.ready == 'true'
        run: /usr/bin/time -f 'TRADE_DIAGNOSTICS_SECONDS=%e' python trade_diagnostics.py
      - name: Run exit-management experiment
        if: steps.data.outputs.ready == 'true'
        run: /usr/bin/time -f 'EXIT_EXPERIMENT_SECONDS=%e' python exit_management_experiment.py
      - name: Run young/small-cap experiment
        if: steps.data.outputs.ready == 'true'
        run: /usr/bin/time -f 'SMALL_CAP_EXPERIMENT_SECONDS=%e' python young_small_cap_experiment.py
      - name: Run CAN SLIM technical overlay experiment
        if: steps.data.outputs.ready == 'true'
        run: /usr/bin/time -f 'CANSLIM_EXPERIMENT_SECONDS=%e' python canslim_overlay_experiment.py
      - name: Upload technical backtest results
        if: always() && steps.data.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: daily-sepa-technical-results
          path: |
            results/
            metadata/
            metadata_sources/
          if-no-files-found: error
