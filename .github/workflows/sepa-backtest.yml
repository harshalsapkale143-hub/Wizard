name: Short-Term Backtest

on:
  push:
  workflow_dispatch:

concurrency:
  group: short-term-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests
      - name: Restore daily market-data cache
        uses: actions/cache@v4
        with:
          path: data
          key: sepa-daily-data-OS-2026-09-08-v1-${{ runner.os }}
      - name: Build daily market data
        run: python scripts/build_nifty50_daily.py
      - name: Validate data
        run: |
          test -s data/NIFTY50.csv
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          req={'timestamp','open','high','low','close','volume'}
          n=sum(1 for f in Path('data').glob('*.csv') if req.issubset(pd.read_csv(f,nrows=1).columns) and len(pd.read_csv(f))>=250)
          print("Valid datasets:",n)
          if n<100: raise SystemExit("Need at least 100 datasets")
          PY
      - name: Run 2-15 and 2-30 day short-term backtest
        run: python short_term_backtest.py
      - name: Upload short-term results
        uses: actions/upload-artifact@v6
        with:
          name: short-term-backtest-results
          path: results_short_term/
          if-no-files-found: error
