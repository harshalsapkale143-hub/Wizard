name: SEPA Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [ main, master ]

concurrency:
  group: sepa-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4 openpyxl xlrd
      - name: Download NSE metadata sources
        run: python scripts/download_nse_metadata_sources.py
      - name: Build point-in-time metadata
        env:
          METADATA_SOURCE_DIR: metadata_sources
          LISTING_SOURCE_FILE: metadata_sources/listing_dates.csv
        run: python scripts/build_historical_metadata.py
      - name: Download and build historical research universe
        run: /usr/bin/time -f 'MARKET_DATA_SECONDS=%e' python scripts/build_nifty50_daily.py
      - name: Validate daily market data
        id: data
        shell: bash
        run: |
          test -s data/NIFTY50.csv
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          required={'timestamp','open','high','low','close','volume'}
          valid=[]
          for f in Path('data').glob('*.csv'):
              d=pd.read_csv(f)
              if required.issubset(d.columns) and len(d)>=250: valid.append(f)
          print('Valid datasets:',len(valid))
          if len(valid)<100: raise SystemExit('Need at least 100 historical stock datasets')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Run daily SEPA/VCP backtest
        if: steps.data.outputs.ready == 'true'
        run: python daily_sepa_backtest.py --data-dir data --market NIFTY50.csv --output results
      - name: Run winner/loser classification
        if: steps.data.outputs.ready == 'true'
        run: python scripts/classify_stock_winners_losers.py
      - name: Run leakage-safe winner-loser feature study
        if: steps.data.outputs.ready == 'true'
        run: python scripts/winner_loser_feature_study.py
      - name: Run entry-quality experiment with 1.5R delayed 50-DMA exit
        if: steps.data.outputs.ready == 'true'
        run: python entry_quality_1p5r_experiment.py
      - name: Upload technical backtest results
        if: always() && steps.data.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: daily-sepa-technical-results
          path: |
            results/
            metadata/
            metadata_sources/
          if-no-files-found: error
