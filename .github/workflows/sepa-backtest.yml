name: SEPA Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [ main, master ]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pyotp

      - name: Download NSE 5-minute data from Angel One
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_CLIENT_LOCAL_IP: ${{ secrets.ANGEL_CLIENT_LOCAL_IP }}
          ANGEL_CLIENT_PUBLIC_IP: ${{ secrets.ANGEL_CLIENT_PUBLIC_IP }}
          ANGEL_MAC_ADDRESS: ${{ secrets.ANGEL_MAC_ADDRESS }}
        run: python angelone_download.py

      - name: Validate historical data
        shell: bash
        run: |
          test -f data/NIFTY50.csv || { echo 'NIFTY50.csv missing'; exit 1; }
          shopt -s nullglob
          files=(data/*.csv)
          (( ${#files[@]} >= 2 )) || { echo 'Fewer than 2 data CSV files found'; exit 1; }
          echo "Found ${#files[@]} data files."

      - name: Run SEPA backtest
        run: |
          EXTRA=""
          [[ -f fundamentals_point_in_time.csv ]] && EXTRA="$EXTRA --fundamentals fundamentals_point_in_time.csv"
          [[ -f sector_map.csv ]] && EXTRA="$EXTRA --sector-map sector_map.csv"
          [[ -f universe_by_date.csv ]] && EXTRA="$EXTRA --universe universe_by_date.csv"
          python minervini_sepa_nse_algo_v3.py \
            --data-dir data \
            --market NIFTY50 \
            --output results $EXTRA

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: sepa-backtest-results
          path: results/
          if-no-files-found: error
