name: SEPA Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
  push:
    branches: [ main, master ]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required market data
        id: data
        shell: bash
        run: |
          if [[ ! -f data/NIFTY50.csv ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No data/NIFTY50.csv found. Waiting for historical data." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          shopt -s nullglob
          files=(data/*.csv)
          if (( ${#files[@]} < 2 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Only the market file is present. Add stock 5-minute CSV files under data/." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Historical data detected: ${#files[@]} CSV files." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        if: steps.data.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.data.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run SEPA backtest
        if: steps.data.outputs.ready == 'true'
        shell: bash
        run: |
          EXTRA=""
          [[ -f fundamentals_point_in_time.csv ]] && EXTRA="$EXTRA --fundamentals fundamentals_point_in_time.csv"
          [[ -f sector_map.csv ]] && EXTRA="$EXTRA --sector-map sector_map.csv"
          [[ -f universe_by_date.csv ]] && EXTRA="$EXTRA --universe universe_by_date.csv"
          python minervini_sepa_nse_algo_v3.py \
            --data-dir data \
            --market NIFTY50 \
            --output results $EXTRA

      - name: Upload backtest results
        if: steps.data.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sepa-backtest-results
          path: results/
          if-no-files-found: error
